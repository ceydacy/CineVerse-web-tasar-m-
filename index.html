<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineVerse</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-nav">
      <div class="container">
        <a class="navbar-brand fw-bold fs-3 text-danger" href="#">
          CINEVERSE
        </a>

        <div class="d-flex gap-2">
          <button class="btn btn-outline-light" id="themeBtn">
            <i class="fa-solid fa-moon"></i>
          </button>

          <button
            class="btn btn-danger"
            data-bs-toggle="modal"
            data-bs-target="#movieModal"
          >
            Film Ekle
          </button>
        </div>
      </div>
    </nav>

    <!-- Hero -->

    <section class="hero">
      <div class="hero-overlay">
        <h1>Sonsuz Film Dünyasına Hoş Geldin</h1>

        <p>Binlerce film ve diziyi keşfet.</p>

        <div class="search-area">
          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Film Ara..."
          />
        </div>
      </div>
    </section>

    <!-- Loading -->

    <div class="container text-center my-5" id="loading">
      <div class="spinner-border text-danger"></div>

      <p class="mt-2">Filmler Yükleniyor...</p>
    </div>

    <!-- Movies -->

    <div class="container mt-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="section-title">Popüler Filmler</h2>

        <span id="movieCount"></span>
      </div>

      <div class="row g-4" id="movieContainer"></div>
    </div>

    <!-- Favorites -->

    <div class="container mt-5 mb-5">
      <h2 class="section-title mb-4">Favorilerim</h2>

      <div class="row g-4" id="favoriteContainer"></div>
    </div>

    <!-- Add Movie Modal -->

    <div class="modal fade" id="movieModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Yeni Film Ekle</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <input
              type="text"
              id="movieName"
              class="form-control mb-3"
              placeholder="Film Adı"
            />

            <input
              type="text"
              id="movieImage"
              class="form-control"
              placeholder="Poster URL"
            />
          </div>

          <div class="modal-footer">
            <button class="btn btn-success" id="saveMovie">Kaydet</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast -->

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
      <div id="liveToast" class="toast">
        <div class="toast-header">
          <strong class="me-auto"> CineVerse </strong>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="toast"
          ></button>
        </div>

        <div class="toast-body" id="toastText"></div>
      </div>
    </div>

    <!-- Movie Detail Modal -->

    <div class="modal fade" id="detailModal">
      <div class="modal-dialog modal-lg">
        <div class="modal-content bg-dark text-white">
          <div class="modal-body" id="detailBody"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="app.js"></script>
  </body>
</html>
